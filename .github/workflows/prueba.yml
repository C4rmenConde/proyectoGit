name: Comparar Tokens

on:
  push:

jobs:
  comprobar:
    runs-on: self-hosted

    steps:
      - name: Comparar token
        shell: powershell
        run: |
          if ("${{ secrets.DEV_TOKEN }}" -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "OK - Coinciden"
          } else {
            Write-Host "ERROR - No coinciden"
            exit 1
          }